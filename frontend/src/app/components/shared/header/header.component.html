<header class="header">
  <div class="header-left">
    <div class="logo-mini">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M13 10V3L4 14h7v7l9-11h-7z"></path>
      </svg>
    </div>
    <h1 class="header-title">AI Jira Assistant</h1>
  </div>

  <div class="header-right">
    <button class="header-btn notification-btn" (click)="toggleNotifications()" [class.active]="showNotifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notification-badge" *ngIf="unreadNotifications > 0">{{ unreadNotifications }}</span>
    </button>

    <button class="header-btn dark-mode-btn" (click)="toggleDarkMode()" [title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="!isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg *ngIf="isDarkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="user-menu" *ngIf="currentUser$ | async as user">
      <div class="user-avatar">
        {{ getUserInitials(user) }}
      </div>
      <div class="user-info">
        <span class="user-name">{{ getUserFullName(user) }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
    </div>
  </div>

  <!-- Notifications Dropdown -->
  <div class="notifications-dropdown animate-slide-in-down" *ngIf="showNotifications">
    <div class="notifications-header">
      <h3>Notifications</h3>
      <button class="mark-read-btn" (click)="markAllAsRead()" [disabled]="unreadNotifications === 0">Tout marquer comme lu</button>
    </div>
    <div class="notifications-list">
      <p class="notifications-state" *ngIf="notificationsLoading">Chargement...</p>
      <p class="notifications-state" *ngIf="!notificationsLoading && notifications.length === 0">Aucune notification</p>
      <div class="notification-item" *ngFor="let notification of notifications"
           [class.unread]="!notification.read" (click)="markAsRead(notification)">
        <div class="notification-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="notification-content">
          <p class="notification-text">{{ notification.message }}</p>
          <span class="notification-time">{{ notification.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
        </div>
      </div>
    </div>
  </div>
</header>
